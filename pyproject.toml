description = "COL8383 A2"
readme = "README.md"
requires-python = ">=3.10, <3.11"
authors = [
    { name = "Mayur Garg", email = "csy257549@iitd.ac.in" }
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.43.0",
]

[tool.uv]
managed = true
package = false
